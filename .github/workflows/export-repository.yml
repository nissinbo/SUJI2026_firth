name: Export repository snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export-repository.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create repository archive
        shell: bash
        run: |
          tar -czf /tmp/repository-snapshot.tar.gz \
            --exclude=.git \
            --exclude=.github/workflows/export-repository.yml \
            .

      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: /tmp/repository-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
