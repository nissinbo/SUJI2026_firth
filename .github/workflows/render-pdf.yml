name: Render presentation PDF

on:
  pull_request:
    paths:
      - ".github/workflows/render-pdf.yml"
      - "_quarto.yml"
      - "_extensions/**"
      - "presentation/**"
      - "results/figures/**"
      - "scripts/render_slides.ps1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-pdf.yml"
      - "_quarto.yml"
      - "_extensions/**"
      - "presentation/**"
      - "results/figures/**"
      - "scripts/render_slides.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render slides
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Cache Typst packages
        uses: actions/cache@v4
        with:
          path: .cache/typst-packages
          key: typst-${{ runner.os }}-quarto-1.10.18-${{ hashFiles('_extensions/**', '_quarto.yml') }}
          restore-keys: |
            typst-${{ runner.os }}-quarto-1.10.18-

      - name: Verify render-only inputs
        shell: pwsh
        run: |
          $required = @(
            "presentation/slides.qmd",
            "presentation/tables.typ",
            "results/figures/intro_bias.png",
            "results/figures/exact_heatmap_decision.png",
            "results/figures/exact_heatmap_aligned.png",
            "results/figures/exact_heatmap_wald_logistf.png",
            "results/figures/exact_heatmap_wald_common_se.png",
            "results/figures/exact_ci_decision.png",
            "results/figures/covariate_ci_decision.png",
            "results/figures/factor_ci_difference.png"
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) {
            throw "Missing committed render inputs: $($missing -join ', ')"
          }
          Write-Host "Using committed calculation outputs only; no R or SAS analysis is executed."

      - name: Render PDF
        shell: pwsh
        run: ./scripts/render_slides.ps1

      - name: Verify PDF output
        shell: pwsh
        run: |
          $pdf = Get-Item -LiteralPath "presentation/slides.pdf"
          if ($pdf.Length -lt 10000) {
            throw "Rendered PDF is unexpectedly small: $($pdf.Length) bytes"
          }
          Write-Host "Rendered $($pdf.FullName) ($([math]::Round($pdf.Length / 1MB, 2)) MB)"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: presentation/slides.pdf
          if-no-files-found: error
          retention-days: 14

  commit-pdf:
    name: Commit generated PDF
    needs: render
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out rendered source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download generated PDF
        uses: actions/download-artifact@v4
        with:
          name: slides-pdf
          path: presentation

      - name: Commit and push PDF if changed
        shell: bash
        run: |
          # Never attach an older PDF to newer source changes.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has advanced; skipping this PDF. Run the workflow on the latest main if needed."
            exit 0
          fi

          git add -- presentation/slides.pdf
          if git diff --cached --quiet; then
            echo "PDF is unchanged; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update rendered presentation PDF"
          # GITHUB_TOKEN pushes do not trigger another push workflow run.
          # A concurrent update to main is rejected by this normal push.
          git push origin HEAD:main
